# Small, reproducible storage workload smoke; rates are illustrative.
instance_id: aiperf-validation
server:
  model_profile: llama-3.2-1b
gpu:
  gpu_profile: GB10
scheduler:
  prefill_tokens_per_second: 10000
  decode_tokens_per_second: 200
  prefill_chunk_tokens: 16
kv:
  lmcache_config_file: lmcache-aiperf-validation.yaml
  trace_file: /tmp/kvbench-aiperf-trace.jsonl
  max_cpu_memory_gb: 0.125
