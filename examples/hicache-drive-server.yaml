server:
  model_profile: llama-3.1-8b
gpu:
  tp_size: 8
timing:
  full_speed: true
scheduler:
  prefill_chunk_tokens: 4096
kv:
  stack: hicache
  active_ranks: [0]
  max_cpu_memory_gb: 2
  hicache:
    storage_path: /mnt/work/kvbench/endurance-placeholder
    page_size: 256
    host_size_gb: 0.25
    disk_size_gb: 64
    mem_layout: page_first_direct
    write_policy: write_through
