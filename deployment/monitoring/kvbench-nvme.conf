# Telegraf native agent drop-in. The sampler does the privileged, read-only
# NVMe calls; Telegraf reads a complete atomic line with its original timestamp.
[[inputs.file]]
  files = ["/var/lib/kvbench-nvme/latest.influx"]
  data_format = "influx"
  interval = "5s"

