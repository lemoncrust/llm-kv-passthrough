# V1 independent combined engines. Mount storage separately before deployment.
all:
  vars:
    ansible_user: ubuntu
    kvbench_model: llama-3.2-1b
    kvbench_gpu: GB10
    kvbench_prefill_tps: 10000
    kvbench_decode_tps: 1000
    kvbench_tp_size: 1
    kvbench_pp_size: 1
    kvbench_memory_limit: 2G
    lmcache_chunk_size: 256
    lmcache_max_local_cpu_size_gb: 0.25
    lmcache_local_disk_path: /var/lib/kvbench/cache
    lmcache_max_local_disk_size_gb: 0.5
    # lmcache_remote_url: redis://your-cache-host:6379
  children:
    kvbench_servers:
      hosts:
        replica-1:
          ansible_host: 10.0.0.11
          kvbench_instance_id: replica-1
        replica-2:
          ansible_host: 10.0.0.12
          kvbench_instance_id: replica-2
