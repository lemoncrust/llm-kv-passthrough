---
# Connectivity/storage smoke, not a performance harness. Drive timed workloads
# using a separately pinned AIPerf/GenAI-Perf client after this check passes.
- name: Verify V1 combined engines
  hosts: kvbench_servers
  tasks:
    - name: Readiness
      uri:
        url: http://localhost:8000/health
        status_code: 200
    - name: Exercise a full prompt and completion
      uri:
        url: http://localhost:8000/v1/chat/completions
        method: POST
        body_format: json
        body:
          model: "{{ kvbench_model | default('llama-3.2-1b') }}"
          messages:
            - role: user
              content: "{{ 'Storage smoke prompt. ' * 256 }}"
          max_completion_tokens: 64
        status_code: 200
        timeout: 120
    - name: Collect observed JSON counters
      uri:
        url: http://localhost:8000/stats
        return_content: true
      register: observed
    - name: Display counters
      debug:
        var: observed.json
