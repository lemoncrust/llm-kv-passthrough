# V1: independent combined replicas, not prefill/decode disaggregation.
x-engine: &engine
  image: kvbench:latest
  build:
    context: ../..
    dockerfile: Dockerfile
  mem_limit: 2g
  depends_on:
    - redis
x-env: &env
  KVBENCH_SERVER__MODEL_PROFILE: llama-3.2-1b
  KVBENCH_SCHEDULER__PREFILL_TOKENS_PER_SECOND: "10000"
  KVBENCH_SCHEDULER__DECODE_TOKENS_PER_SECOND: "1000"
  LMCACHE_MAX_LOCAL_CPU_SIZE: "0.25"
  LMCACHE_LOCAL_DISK: ""
  LMCACHE_REMOTE_URL: "redis://redis:6379"
  LMCACHE_REMOTE_SERDE: naive
services:
  redis:
    image: redis:7-alpine
    mem_limit: 384m
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
  replica-1:
    <<: *engine
    ports: ["8000:8000"]
    environment:
      <<: *env
      KVBENCH_INSTANCE_ID: replica-1
  replica-2:
    <<: *engine
    ports: ["8001:8000"]
    environment:
      <<: *env
      KVBENCH_INSTANCE_ID: replica-2
